# redxd configuration. Every key is optional; defaults shown.
# Precedence: defaults < preset < this file < REDX_* environment < command line flags.
# The web console (open the listen address in a browser) can create this file for you: Presets page.

# preset = "server"                   # server | vps | website | app | game | edge | dev | cluster | backup | all   (redx preset show NAME)
# bootstrap = "auto"                  # first admin key: auto | web (browser, loopback only) | console (printed once) | off

# data_dir = "/var/lib/redx"          # Windows (user): %LOCALAPPDATA%\RedX\data ; macOS (user): ~/Library/Application Support/RedX/data
listen = "127.0.0.1:7777"             # loopback by default. For other devices use 0.0.0.0:7777 AND tls = "auto"
# tls = "off"                         # off | auto (self-signed, printed fingerprint) | files
# tls_cert = "/etc/redx/cert.pem"
# tls_key  = "/etc/redx/key.pem"
# tls_hosts = ["redx.lan", "192.168.1.20"]   # extra names/IPs for the auto certificate

# node_id = "pi-garage"               # default: generated once and stored in <data_dir>/node.id
role = "leader"                       # leader | follower
# peers = ["https://192.168.1.10:7777"]   # follower: first entry is the leader
# advertise = "https://192.168.1.20:7777" # how other nodes reach THIS node (shown in `redx node status`)
# cluster_secret = ""                 # optional shared secret for static clusters (docker-compose); prefer `redx node join`
# repl_log_max = 1000000              # replication log entries kept for follower catch-up (older => full snapshot)
# heartbeat_seconds = 3

default_db = "default"                # database served by /v1/path/...
# rate_limit_rps = 100                # default per-key limit (keys can override); burst defaults to 2x
# keystore_encrypt = false            # encrypt keys.red-xai-keys at rest: needs env REDX_KEYSTORE_PASSPHRASE
# audit_log = ""                      # default <data_dir>/audit.log (JSON lines, never contains keys)
# audit_success = false               # also log every successful authentication
# grpc_listen = ""                    # reserved, ignored (gRPC is not implemented)
# max_body_mb = 16
# max_upload_mb = 1024      # largest single pack file upload
# log_level = "info"                  # info | debug | quiet

# --- .red-xai-sec encryption and .red-xai-code scripts (0.2.0) ---
# master_key_file = "/etc/redx/master.key"   # create with `redxd keygen --out FILE`; must be mode 0600; the key is
#                                            # never read from env or flags. Default: <data_dir>/master.key if present.
# code_allowed_boxes = ["players.red-xai.db:Player"]   # file:Box globs scripts may touch; empty = none

# --- Red-XAI Accounts sign-in for the web console (0.5) ---  see docs/accounts.md
# accounts_issuer = "https://accounts.red-xai.example"   # empty = off; API keys always work
# accounts_client_id = "redx"
# accounts_redirect_url = "https://redx.example.com/v1/auth/callback"   # default <advertise>/v1/auth/callback
# accounts_master_db = "redxai_accounts"                 # the master accounts DB: owners only
# accounts_client_secret_file = "/run/secrets/redx-accounts-client"  # or env REDX_ACCOUNTS_CLIENT_SECRET (never commit)
# accounts_events_poll_seconds = 15
# owner_emails = ["owner@example.com"]                   # deploy config only; or env REDXAI_OWNER_EMAILS.
#                                                        # Owners also need a verified email and a 2FA sign-in.
# Client secret (confidential clients only): env REDX_ACCOUNTS_CLIENT_SECRET, never in this file.

# --- host updates (phase 1) ---
# The Ed25519 signing key is never a config value. Set one of:
#   env REDX_UPDATE_SIGNING_KEY            (base64 or hex, 32-byte seed or 64-byte key; not logged)
#   update_signing_key_file = "/etc/redx/update-signing.key"   # mode 0600; or REDX_UPDATE_SIGNING_KEY_FILE
# If neither is set, redxd creates <data_dir>/updates/signing.key (mode 0600) on first start.
# update_signing_key_file = "/etc/redx/update-signing.key"
# github_webhook_secret_file = "/etc/redx/github-webhook.secret"  # mode 0600; or env REDX_GITHUB_WEBHOOK_SECRET
# github_repo = "red-xai/redx"            # default repo for POST /v1/updates/.../publish target github
# hosted_apps = ["redx"]                  # app ids this host may serve as source "host" (or env REDX_HOSTED_APPS)
# A GitHub token, when publishing to GitHub, is env REDX_GITHUB_TOKEN only.
