<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RedX">
  <title>RedX</title>
  <defs>
    <linearGradient id="rxt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1519"/><stop offset="1" stop-color="#0d0709"/></linearGradient>
    <radialGradient id="rxg" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#ff2a2a" stop-opacity=".30"/><stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/></radialGradient>
    <linearGradient id="rxb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/>
      <stop offset=".55" stop-color="#e3162a"/>
      <stop offset="1" stop-color="#8a0618"/>
    </linearGradient>
    <linearGradient id="rxh" gradientUnits="userSpaceOnUse" x1="-196" y1="0" x2="160" y2="0">
      <stop offset="0" stop-color="#7a0615"/>
      <stop offset=".5" stop-color="#c8102e"/>
      <stop offset="1" stop-color="#ff3b30"/>
    </linearGradient>
    <g id="rxs">
      <!-- snath (handle) -->
      <path d="M-196 0H160" stroke="url(#rxh)" stroke-width="22" stroke-linecap="round" fill="none"/>
      <g transform="translate(140 0) scale(1.22) translate(-140 0)">
      <path d="M142 -9C196 -14 236 18 232 72C229 112 202 150 148 176C168 140 175 110 170 84C163 50 148 28 142 9Z" fill="url(#rxb)"/>
      <!-- bright edge line -->
      <path d="M232 72C229 112 202 150 148 176C168 140 175 110 170 84" fill="none" stroke="#ffb3a6" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- ferrule -->
      <rect x="126" y="-16" width="26" height="32" rx="7" fill="#5a0412"/>
      <circle cx="-196" cy="0" r="15" fill="#7a0615"/>
    </g>
  </defs>
  <g transform="translate(256 266) scale(.82)">
    <g transform="rotate(-45)"><use href="#rxs"/></g>
    <!-- dark keyline so the front scythe reads as crossing over the back one -->
    <g transform="scale(-1 1) rotate(-45)" stroke="#2a050c" stroke-width="28" stroke-linecap="round"><path d="M-196 0H160" fill="none"/></g>
    <g transform="scale(-1 1) rotate(-45)"><use href="#rxs"/></g>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#rxt)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#rxg)"/>
  <g transform="translate(40.96000000000001 40.96000000000001) scale(0.84)"><g transform="translate(256 266) scale(.82)">
    <g transform="rotate(-45)"><use href="#rxs"/></g>
    <!-- dark keyline so the front scythe reads as crossing over the back one -->
    <g transform="scale(-1 1) rotate(-45)" stroke="#2a050c" stroke-width="28" stroke-linecap="round"><path d="M-196 0H160" fill="none"/></g>
    <g transform="scale(-1 1) rotate(-45)"><use href="#rxs"/></g>
  </g>
</g>
</svg>
